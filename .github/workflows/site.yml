name: Build and publish the book

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Pango (needed by WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - name: Install
        run: uv sync --extra pdf

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

      - name: Data report
        run: uv run sfrpg check

      - name: Build site
        run: uv run mkdocs build --strict

      - name: Build PDF and standalone pages
        run: |
          uv run sfrpg pdf --out site/sfrpg.pdf
          uv run sfrpg pages --out site/pages
          uv run sfrpg sheet examples/grok.yaml --out site/sheets

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
