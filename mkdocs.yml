site_name: Square Fireballs RPG
site_description: A role playing game of tactical fantasy
site_author: Pedro Capelastegui
repo_url: https://github.com/capelastegui/sfrpg
edit_uri: edit/main/book/
copyright: >-
  Content © Pedro Capelastegui, licensed under
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>.
  An independent, non-commercial fan project, not affiliated with, endorsed or sponsored by
  any publisher of the games that inspired it.

docs_dir: book
site_dir: site

# Expands the data macros ({{ build_powers(...) }} etc.) in every chapter.
hooks:
  - src/sfrpg/mkdocs_hook.py

nav:
  - Home: index.md
  - Rules:
      - introduction.md
      - character-building.md
      - adventuring.md
      - combat.md
      - skills.md
  - Characters:
      - origins.md
      - classes.md
      - feats.md
      - items.md
  - Game Master:
      - monsters.md
  - Reference:
      - reference.md
      - optional-material.md

theme:
  name: material
  logo: images/logo.png
  favicon: images/logo.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: custom  # navy, set in css/sfrpg.css
      accent: deep orange

extra_css:
  - css/sfrpg.css

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - toc:
      permalink: true
