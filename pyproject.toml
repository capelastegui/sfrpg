[project]
name = "sfrpg"
version = "0.2.0"
description = "Source data and build tooling for the Square Fireballs RPG rulebook"
authors = [{ name = "Pedro Capelastegui" }]
license = "CC-BY-NC-4.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.6",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]

[project.scripts]
sfrpg = "sfrpg.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfrpg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]
